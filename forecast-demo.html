<!DOCTYPE html>
<html lang="en">
<head>

    <style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body { font-family:'Montserrat',sans-serif; background:#f4f6f9; color:#1a2744; }

.demo { position:fixed; inset:0; display:flex; flex-direction:column; }
.demo-header { padding:12px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e0e4ed; background:#fff; }
.demo-title { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#1a2744; }
.demo-esc { font-size:10px; color:#555; font-weight:600; }
.demo-esc kbd { background:#e8ecf2; border:1px solid #ccd2de; padding:2px 6px; border-radius:3px; font-size:9px; color:#333; font-weight:700; }
.demo-body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; position:relative; overflow:hidden; background:#f4f6f9; }

.disclaimer { font-size:14px; font-weight:800; color:#d32f2f; letter-spacing:1px; animation:disclaimerPulse 2s ease infinite; }
@keyframes disclaimerPulse { 0%,100%{text-shadow:0 0 4px rgba(211,47,47,0.3);} 50%{text-shadow:0 0 12px rgba(211,47,47,0.6),0 0 20px rgba(211,47,47,0.2);} }

/* Phases */
.phase { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; padding:30px; }
.phase.active { display:flex; }

/* Phase 1 */
.big-number { font-size:64px; font-weight:800; color:#1565c0; letter-spacing:-2px; opacity:0; transform:scale(0.8); transition:all .8s ease; position:relative; z-index:5; }
.big-number.show { opacity:1; transform:scale(1); }
.big-label { font-size:12px; color:#6b7a94; letter-spacing:3px; text-transform:uppercase; margin-top:8px; opacity:0; transition:opacity .5s .4s; }
.big-label.show { opacity:1; }
.explode-stage { display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; width:100%; height:100%; }
.explode-stage.shrink { transform:scale(0.35); opacity:0; transition:all 1s ease; position:absolute; pointer-events:none; }
.arrows-container { position:absolute; inset:0; pointer-events:none; }
.arrow-line { position:absolute; top:50%; left:50%; width:0; height:2px; background:linear-gradient(90deg,#1565c0,#90caf9); transform-origin:left center; opacity:0; transition:width 0.7s ease, opacity 0.3s; border-radius:1px; }
.arrow-line.show { opacity:1; }
.segment-ring { position:absolute; inset:0; pointer-events:none; }
.seg-label { position:absolute; font-size:8px; font-weight:600; color:#1565c0; background:#e3f2fd; padding:3px 8px; border-radius:10px; border:1px solid #bbdefb; opacity:0; transform:scale(0.7); transition:all .4s ease; white-space:nowrap; }
.seg-label.show { opacity:1; transform:scale(1); }
.info-stage { display:none; flex-direction:column; align-items:center; width:100%; max-width:900px; opacity:0; transform:translateY(12px); transition:all .6s ease; }
.info-stage.show { display:flex; opacity:1; transform:translateY(0); }
.info-row { display:flex; gap:20px; width:100%; margin-bottom:12px; }
.info-half { flex:1; }
.info-badge { font-size:9px; font-weight:700; letter-spacing:2px; padding:4px 12px; border-radius:12px; display:inline-block; margin-bottom:6px; }
.info-text { font-size:10.5px; color:#1a2744; line-height:1.6; }
.info-divider { width:2px; background:linear-gradient(180deg,transparent,#1565c0,transparent); }
.info-models { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
.info-model { background:#fff; border:1px solid #e0e4ed; border-radius:8px; padding:8px 12px; text-align:center; min-width:120px; opacity:0; transform:translateY(6px); transition:all .4s ease; }
.info-model.show { opacity:1; transform:translateY(0); }
.info-model.winner { border-color:#1565c0; background:#e3f2fd; }
.info-model.winner-g { border-color:#2e7d32; background:#e8f5e9; }
.info-model-name { font-size:9px; font-weight:700; color:#1a2744; }
.info-model-detail { font-size:8px; color:#6b7a94; margin-top:2px; }
.fracture-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:620px; width:100%; margin-top:24px; opacity:0; transform:translateY(20px); transition:all .8s ease; }
.fracture-grid.show { opacity:1; transform:translateY(0); }
.frac-cell { background:#fff; border:1px solid #e0e4ed; border-radius:8px; padding:12px 10px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
.frac-region { font-size:8px; font-weight:700; color:#6b7a94; letter-spacing:1.5px; margin-bottom:4px; }
.frac-val { font-size:16px; font-weight:800; color:#1565c0; }
.frac-seg { font-size:7px; color:#9aa5b8; margin-top:2px; }
</style>
</head>
<body>
<div class="demo">
    <div class="demo-header">
        <div class="demo-title">Revenue & Receivables Forecast Model</div>
    </div>
    <div class="demo-body">
        <div class="phase active" id="ph1">
            <div class="phase-esc">Press <kbd>ESC</kbd> to exit</div>

            <div class="explode-stage" id="explodeStage">

                <div class="big-label" id="bigLabel">Annual Revenue Target — One Number</div>
                <div class="arrows-container" id="arrowsContainer"></div>
                <div class="segment-ring" id="segmentRing"></div>

            <div class="info-stage" id="infoStage">
                <div class="info-row">

                <div class="info-models" id="infoModels"></div>
                <div style="text-align:center;margin-top:14px;"><button class="dash-continue" id="fcContinueBtn" onclick="skipToPhase(4)" style="display:none;">Continue to Assumptions Dashboard →</button></div>
            </div>
            <div class="phase-controls"><button class="ph-btn" id="ph1Pause" onclick="togglePause()">Pause</button><button class="ph-btn" onclick="skipToPhase(4)">Skip →</button></div>
        </div>
        <div class="phase" id="ph2"></div>
        <div class="phase" id="ph3"></div>
        <div class="phase" id="ph4"><div class="phase-esc">Press <kbd>ESC</kbd> to exit</div><div class="dashboard" id="dashboard"></div></div>
        <div class="phase" id="ph5"><div class="phase-esc">Press <kbd>ESC</kbd> to exit</div><div class="calc-view" id="calcView"></div><div class="phase-controls"><button class="ph-btn" onclick="skipToPhase(6)">Skip →</button></div></div>
        <div class="phase" id="ph6"><div class="phase-esc">Press <kbd>ESC</kbd> to exit</div><div class="result-dash" id="resultDash"></div></div>
    </div>
    <div class="demo-footer"><div class="disclaimer">⚠ Values, segments, and structure are modified for presentation purposes. Not actual business data.</div></div>
</div>

<style>
/* Phase 2: Method Race */
.method-race { width:100%; max-width:700px; }
.race-title { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#6b7a94; text-align:center; margin-bottom:20px; }
.race-methods { display:flex; gap:16px; }
.race-card { flex:1; background:#fff; border:1px solid #e0e4ed; border-radius:10px; padding:16px; text-align:center; transition:all .5s; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
.race-card.winner { border-color:#43a047; background:#f1f8e9; box-shadow:0 4px 16px rgba(67,160,71,0.12); }
.race-name { font-size:10px; font-weight:700; color:#1a2744; margin-bottom:10px; }
.race-bar { height:6px; background:#eef0f5; border-radius:3px; overflow:hidden; margin-bottom:8px; }
.race-fill { height:100%; border-radius:3px; width:0%; transition:width 2s ease; }

.race-card:nth-child(2) .race-fill { background:#43a047; }
.race-card:nth-child(3) .race-fill { background:#ef6c00; }
.race-mape { font-size:20px; font-weight:800; color:#1a2744; opacity:0; transition:opacity .5s; }
.race-mape.show { opacity:1; }
.race-label { font-size:8px; color:#9aa5b8; margin-top:2px; }
.race-weight { font-size:9px; color:#6b7a94; margin-top:8px; font-weight:600; }

/* Phase 3: Heatmap */
.heatmap-wrap { width:100%; max-width:750px; }
.heat-title { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#6b7a94; text-align:center; margin-bottom:16px; }
.heat-grid { display:grid; grid-template-columns:90px repeat(7,1fr); gap:2px; }
.heat-header { font-size:7px; font-weight:700; color:#6b7a94; text-align:center; padding:6px 2px; }
.heat-region { font-size:8px; font-weight:700; color:#1a2744; display:flex; align-items:center; padding:0 6px; }
.heat-cell { border-radius:4px; padding:8px 4px; text-align:center; font-size:9px; font-weight:600; color:#fff; opacity:0; transform:scale(0.8); transition:all .3s; }
.heat-cell.show { opacity:1; transform:scale(1); }

/* Phase 4: Dashboard */
.dashboard { width:100%; max-width:1100px; background:#fff; border:1px solid #e0e4ed; border-radius:14px; padding:20px 28px; box-shadow:0 4px 20px rgba(0,0,0,0.04); overflow-y:auto; max-height:82vh; }
.dash-title { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#6b7a94; margin-bottom:14px; }
.dash-row { display:flex; gap:14px; margin-bottom:12px; flex-wrap:wrap; }
.dash-input-group { flex:1; min-width:140px; }
.dash-label { font-size:8px; color:#6b7a94; letter-spacing:1px; text-transform:uppercase; margin-bottom:5px; font-weight:600; }
.dash-select { width:100%; padding:7px 10px; background:#f8f9fb; border:1px solid #e0e4ed; border-radius:6px; color:#1a2744; font-family:'Montserrat',sans-serif; font-size:10px; }
.dash-slider-row { display:flex; align-items:center; gap:8px; }
.dash-slider-row input[type=range] { flex:1; height:4px; -webkit-appearance:none; background:#e0e4ed; border-radius:2px; border:none; cursor:pointer; }
.dash-slider-row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#1565c0; cursor:pointer; }
.dash-val { font-size:11px; font-weight:700; color:#1565c0; min-width:50px; text-align:right; }
.dash-chart { width:100%; height:220px; background:#f8f9fb; border-radius:8px; border:1px solid #eef0f5; position:relative; overflow:hidden; margin:12px 0; }
.dash-chart canvas { width:100%; height:100%; }
.dash-assumption { margin-top:12px; padding:12px 16px; background:#e3f2fd; border:1px solid #bbdefb; border-radius:8px; }
.dash-assumption-title { font-size:9px; font-weight:700; color:#1565c0; letter-spacing:1px; margin-bottom:6px; }
.dash-assumption-name { font-size:12px; font-weight:700; color:#1a2744; margin-bottom:4px; opacity:0; transition:opacity .5s; }
.dash-assumption-name.show { opacity:1; }
.dash-assumption-val { font-size:10px; color:#1565c0; font-weight:600; opacity:0; transition:opacity .5s; }
.dash-assumption-val.show { opacity:1; }
.dash-months { display:grid; grid-template-columns:repeat(12,1fr); gap:6px; margin-top:10px; }
.dash-month-col { text-align:center; }
.dash-month-lbl { font-size:8px; color:#6b7a94; margin-bottom:4px; font-weight:600; }
.dash-month-slider { writing-mode:vertical-lr; direction:rtl; width:6px; height:70px; -webkit-appearance:none; background:linear-gradient(180deg,#1565c0,#bbdefb); border-radius:3px; cursor:pointer; margin:0 auto; display:block; }
.dash-month-slider::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#1565c0; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,0.2); }
.dash-month-val { font-size:8px; color:#1565c0; font-weight:700; margin-top:4px; }
.dash-continue { margin-top:14px; padding:10px 28px; border-radius:20px; background:#1565c0; color:#fff; border:none; cursor:pointer; font-family:'Montserrat',sans-serif; font-size:11px; font-weight:700; letter-spacing:1px; box-shadow:0 4px 12px rgba(21,101,192,0.2); transition:all .3s; }
.dash-continue:hover { background:#0d47a1; transform:translateY(-1px); }
.dash-legend { display:flex; gap:20px; justify-content:center; margin-top:10px; }
.dash-leg { font-size:11px; color:#1a2744; display:flex; align-items:center; gap:6px; font-weight:500; }
.dash-leg-dot { width:14px; height:4px; border-radius:2px; }
.dash-model-switch { display:flex; gap:6px; align-items:center; }
.dash-model-btn { padding:5px 12px; border-radius:14px; border:1px solid #e0e4ed; background:#f8f9fb; font-size:9px; font-weight:600; color:#6b7a94; cursor:pointer; transition:all .2s; font-family:'Montserrat',sans-serif; }
.dash-model-btn.active { background:#1565c0; color:#fff; border-color:#1565c0; }
.dash-model-btn:hover:not(.active) { border-color:#1565c0; color:#1565c0; }
</style>

<style>
/* Phase 5: Calculation - Table Grid */
.calc-view { width:100%; max-width:800px; }
.calc-title { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#6b7a94; text-align:center; margin-bottom:16px; }
.calc-table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.04); }
.calc-table th { font-size:8px; font-weight:700; color:#6b7a94; letter-spacing:1px; text-transform:uppercase; padding:10px 12px; background:#f4f6f9; border-bottom:1px solid #e0e4ed; text-align:left; }
.calc-table td { padding:8px 12px; border-bottom:1px solid #f0f2f5; font-size:10px; color:#1a2744; vertical-align:middle; }
.calc-table tr { opacity:0; transform:translateX(-6px); transition:opacity .4s,transform .4s; }
.calc-table tr.show { opacity:1; transform:translateX(0); }
.calc-table tr.active { background:#e3f2fd; }
.calc-table .col-step { font-weight:700; color:#1565c0; width:30px; }
.calc-table .col-desc { width:200px; }
.calc-table .col-formula { font-family:monospace; font-size:9px; color:#6b7a94; }
.calc-table .col-input { font-weight:600; color:#1a2744; }
.calc-table .col-result { font-weight:800; color:#1565c0; font-size:12px; text-align:right; opacity:0; transition:opacity .5s; }
.calc-table .col-result.show { opacity:1; }
.calc-table tr.final-row td { background:#e8f5e9; border-top:2px solid #43a047; font-weight:700; }
.calc-table tr.final-row .col-result { color:#2e7d32; font-size:14px; }

/* Phase 6: Executive Dashboard */
.result-dash { width:100%; max-width:1100px; overflow-y:auto; max-height:78vh; }
.rd-header { text-align:center; margin-bottom:16px; }
.rd-header h2 { font-size:16px; font-weight:800; color:#1a2744; letter-spacing:1px; }
.rd-header p { font-size:9px; color:#6b7a94; margin-top:4px; letter-spacing:1px; }
.rd-charts-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:14px; }
.rd-chart-card { background:#fff; border-radius:8px; padding:12px; border:1px solid #e0e4ed; box-shadow:0 1px 4px rgba(0,0,0,0.03); }
.rd-chart-title { font-size:8px; font-weight:700; color:#6b7a94; letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; }
.rd-chart-canvas { width:100%; height:100px; }
.rd-section { background:#fff; border-radius:8px; border:1px solid #e0e4ed; margin-bottom:10px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.03); }
.rd-section-header { background:#1a3a5c; color:#fff; padding:6px 12px; font-size:9px; font-weight:700; letter-spacing:1px; }
.rd-table { width:100%; border-collapse:collapse; font-size:9px; }
.rd-table th { background:#f4f6f9; padding:5px 8px; text-align:center; font-weight:700; color:#6b7a94; font-size:8px; letter-spacing:0.5px; border-bottom:1px solid #e0e4ed; }
.rd-table td { padding:4px 8px; text-align:right; border-bottom:1px solid #f4f6f9; color:#1a2744; font-size:9px; }
.rd-table td:first-child { text-align:left; font-weight:600; color:#1a3a5c; font-size:8px; }
.rd-table tr:last-child td { font-weight:700; border-top:1px solid #1a3a5c; background:#eef2f7; }
.rd-table .negative { color:#c62828; }
.rd-table .positive { color:#2e7d32; }
.rd-table .pct { font-size:7px; color:#6b7a94; }
.rd-kpi-strip { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:14px; }
.rd-kpi-card { background:#fff; border-radius:8px; padding:10px; text-align:center; border:1px solid #e0e4ed; border-top:3px solid #1565c0; }
.rd-kpi-val { font-size:18px; font-weight:800; color:#1a2744; }
.rd-kpi-lbl { font-size:7px; color:#6b7a94; margin-top:2px; letter-spacing:1px; text-transform:uppercase; }
.rd-kpi-card:nth-child(4) { border-top-color:#43a047; }
.rd-kpi-card:nth-child(5) { border-top-color:#ef6c00; }

/* Skip / Phase nav */
.phase-skip { position:absolute; bottom:16px; left:20px; padding:6px 14px; border-radius:12px; background:#fff; border:1px solid #e0e4ed; color:#6b7a94; font-family:'Montserrat',sans-serif; font-size:9px; font-weight:600; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,0.04); }
.phase-skip:hover { border-color:#1565c0; color:#1565c0; }
.phase-controls { position:absolute; bottom:16px; left:20px; display:flex; gap:8px; }
.phase-esc { position:absolute; top:12px; right:16px; font-size:9px; color:#888; font-weight:600; }
.phase-esc kbd { background:#e8ecf2; border:1px solid #ccd2de; padding:2px 5px; border-radius:3px; font-size:8px; color:#333; font-weight:700; }
.ph-btn { padding:6px 14px; border-radius:12px; background:#fff; border:1px solid #e0e4ed; color:#6b7a94; font-family:'Montserrat',sans-serif; font-size:9px; font-weight:600; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,0.04); transition:all .2s; }
.ph-btn:hover { border-color:#1565c0; color:#1565c0; }
.ph-btn.paused { background:#e3f2fd; border-color:#1565c0; color:#1565c0; }

/* ===== SPLIT SCREEN (Revenue top / Receivables bottom) ===== */
.split-screen { width:100%; max-width:1100px; height:100%; display:flex; flex-direction:column; gap:0; }
.split-top, .split-bottom { flex:1; padding:12px 24px; overflow-y:auto; position:relative; display:flex; gap:16px; }
.split-divider { height:2px; background:linear-gradient(90deg,transparent,#1565c0,transparent); margin:0 40px; flex-shrink:0; }
.split-header { margin-bottom:8px; }
.split-badge { font-size:9px; font-weight:700; letter-spacing:2px; padding:4px 12px; border-radius:12px; }
.rev-badge { background:#e3f2fd; color:#1565c0; }
.rec-badge { background:#e8f5e9; color:#2e7d32; }
.split-content { display:flex; flex-direction:column; gap:6px; flex:1; }
.split-side { display:flex; flex-direction:column; gap:6px; min-width:200px; max-width:240px; }

/* Content blocks within split screen */
.sc-block { opacity:0; transform:translateY(6px); transition:opacity .4s,transform .4s; }
.sc-block.show { opacity:1; transform:translateY(0); }
.sc-number { display:inline-block; background:#fff; border:1px solid #e0e4ed; border-radius:8px; padding:10px 20px; font-size:24px; font-weight:800; color:#1565c0; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
.sc-number.green { color:#2e7d32; border-color:#c8e6c9; }
.sc-text { font-size:12px; color:#1a2744; line-height:1.7; }
.sc-dim { font-size:11px; color:#6b7a94; line-height:1.6; }
.sc-model-card { display:inline-block; background:#fff; border:1px solid #e0e4ed; border-radius:8px; padding:12px 18px; margin:3px 6px 3px 0; min-height:54px; }
.sc-model-name { font-size:11px; font-weight:700; color:#1a2744; }
.sc-model-detail { font-size:9px; color:#6b7a94; margin-top:3px; }
.sc-model-card.winner { border-color:#1565c0; background:#e3f2fd; }
.sc-model-card.winner-green { border-color:#2e7d32; background:#e8f5e9; }
.sc-label { font-size:9px; font-weight:700; color:#6b7a94; letter-spacing:1.5px; text-transform:uppercase; margin-top:4px; }
.sc-list { font-size:11px; color:#1a2744; line-height:1.8; padding-left:16px; }
.sc-highlight { background:#fffde7; border-left:3px solid #f9a825; padding:10px 14px; border-radius:6px; font-size:11px; color:#1a2744; line-height:1.6; }
</style>

<script>
var regions=['North America','Europe','Asia Pacific','Latin America'];
var segments=['Enterprise Cloud','SMB Standard','Strategic Partners','Resellers','AI & Compute','Managed Services','Direct Sales'];
var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function drawDashChart(){
    var canvas=document.getElementById('dashCanvas');if(!canvas)return;
    var ctx=canvas.getContext('2d');
    canvas.width=canvas.offsetWidth*2;canvas.height=canvas.offsetHeight*2;
    ctx.scale(2,2);var w=canvas.offsetWidth,h=canvas.offsetHeight;
    ctx.clearRect(0,0,w,h);
    var baseVal=140;
    // Model affects the baseline shape
    var modelMult=currentModel==='dso'?[1.1,0.95,1.05,0.98,1.02,1.08,1.12,1.06,0.97,1.03,1.09,1.01]:currentModel==='turnover'?[0.95,0.92,0.98,1.0,1.05,1.1,1.15,1.1,1.02,1.0,1.08,1.03]:seasonalIndex;
    // Prior year: chaotic actual (jagged, unpredictable)
    var priorNoise=[0.72,0.95,0.81,1.12,0.88,1.18,0.94,1.22,0.76,1.08,1.15,0.85];
    var prior=priorNoise.map(function(n,i){return modelMult[i]*baseVal*0.85*n;});
    var baseline=modelMult.map(function(s){return s*baseVal;});
    var adjusted=modelMult.map(function(s,i){return s*baseVal+monthlyAssumption[i]*1.2;});
    var allVals=prior.concat(baseline).concat(adjusted);
    var maxV=Math.max.apply(null,allVals)*1.15;
    var minV=Math.min.apply(null,allVals)*0.85;if(minV<0)minV=minV*1.1;
    function yPos(v){return h-18-((v-minV)/(maxV-minV))*(h-30);}
    // Grid lines
    ctx.strokeStyle='#eef0f5';ctx.lineWidth=0.5;
    for(var i=0;i<12;i++){var x=24+i*(w-48)/11;ctx.beginPath();ctx.moveTo(x,8);ctx.lineTo(x,h-18);ctx.stroke();}
    // Prior year (dashed, chaotic)
    ctx.setLineDash([4,4]);ctx.strokeStyle='#bbb';ctx.lineWidth=1.5;
    ctx.beginPath();prior.forEach(function(v,i){var x=24+i*(w-48)/11;i===0?ctx.moveTo(x,yPos(v)):ctx.lineTo(x,yPos(v));});ctx.stroke();ctx.setLineDash([]);
    // Baseline
    ctx.strokeStyle='#1565c0';ctx.lineWidth=2;
    ctx.beginPath();baseline.forEach(function(v,i){var x=24+i*(w-48)/11;i===0?ctx.moveTo(x,yPos(v)):ctx.lineTo(x,yPos(v));});ctx.stroke();
    // Adjusted (with assumption)
    ctx.strokeStyle='#43a047';ctx.lineWidth=2.5;
    ctx.beginPath();adjusted.forEach(function(v,i){var x=24+i*(w-48)/11;i===0?ctx.moveTo(x,yPos(v)):ctx.lineTo(x,yPos(v));});ctx.stroke();
    // Fill between
    ctx.beginPath();ctx.fillStyle='rgba(67,160,71,0.08)';
    baseline.forEach(function(v,i){ctx.lineTo(24+i*(w-48)/11,yPos(v));});
    for(var i=11;i>=0;i--)ctx.lineTo(24+i*(w-48)/11,yPos(adjusted[i]));
    ctx.closePath();ctx.fill();
    // Labels
    ctx.fillStyle='#6b7a94';ctx.font='8px Montserrat';
    months.forEach(function(m,i){ctx.fillText(m,20+i*(w-48)/11,h-4);});
}

    speak('The executive dashboard: the complete forecast output with monthly projections, aging analysis, collection performance, and key ratios. All recalculated in real time when any assumption changes.',function(){
        var endMsg=document.createElement('div');endMsg.style.cssText='text-align:center;margin-top:16px;padding:10px;font-size:11px;font-weight:600;color:#6b7a94;letter-spacing:1.5px;';
        endMsg.innerHTML='Press <kbd style="background:#e8ecf2;border:1px solid #ccd2de;padding:2px 6px;border-radius:3px;font-size:10px;color:#333;font-weight:700;">ESC</kbd> to exit';
        rd.appendChild(endMsg);
    });
}

function drawBarChart(id,data1,data2){
    var canvas=document.getElementById(id);if(!canvas)return;
    var ctx=canvas.getContext('2d');canvas.width=canvas.offsetWidth*2;canvas.height=canvas.offsetHeight*2;
    ctx.scale(2,2);var w=canvas.offsetWidth,h=canvas.offsetHeight;
    var max=Math.max.apply(null,data1.concat(data2))*1.2;
    var barW=(w-30)/(12*2.5);
    for(var i=0;i<12;i++){
        var x=14+i*(w-28)/12;
        var h1=(data1[i]/max)*(h-16);var h2=(data2[i]/max)*(h-16);
        ctx.fillStyle='#1565c0';ctx.fillRect(x,h-8-h1,barW,h1);
        ctx.fillStyle='#ef6c00';ctx.fillRect(x+barW+1,h-8-h2,barW,h2);
    }
}
function drawLineChart(id,data,color){
    var canvas=document.getElementById(id);if(!canvas)return;
    var ctx=canvas.getContext('2d');canvas.width=canvas.offsetWidth*2;canvas.height=canvas.offsetHeight*2;
    ctx.scale(2,2);var w=canvas.offsetWidth,h=canvas.offsetHeight;
    var max=Math.max.apply(null,data)*1.3;var min=Math.min.apply(null,data.filter(function(v){return v>0;}))*0.7;
    ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;
    data.forEach(function(v,i){if(v===0)return;var x=14+i*(w-28)/11;var y=h-8-((v-min)/(max-min))*(h-16);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.stroke();
    // Fill
    ctx.lineTo(14+11*(w-28)/11,h-8);ctx.lineTo(14,h-8);ctx.closePath();
    ctx.fillStyle=color==='#1565c0'?'rgba(21,101,192,0.08)':'rgba(239,108,0,0.08)';ctx.fill();
}
